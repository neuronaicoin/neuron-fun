name: deploy-rewards

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Where to deploy"
        type: choice
        options:
          - robinhood-testnet
          - base-sepolia
      broadcast:
        description: "Actually send transactions (leave unticked for a free dry run)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Deploy the fee splitter and the batch payer
        env:
          RAW_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          NETWORK: ${{ inputs.network }}
          BROADCAST: ${{ inputs.broadcast }}
          REWARDS_VAR: ${{ vars.REWARDS }}
          SAFE_VAR: ${{ vars.SAFE }}
        run: |
          KEY="$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')"
          if [ -z "$KEY" ]; then echo "DEPLOYER_PRIVATE_KEY secret is missing"; exit 1; fi
          case "$KEY" in 0x*) ;; *) KEY="0x$KEY" ;; esac
          echo "::add-mask::$KEY"
          export PRIVATE_KEY="$KEY"
          if [ -z "$REWARDS_VAR" ]; then echo "Add the repo variable REWARDS (the rewards wallet's address) first"; exit 1; fi
          export REWARDS="$REWARDS_VAR"
          if [ -n "$SAFE_VAR" ]; then export SAFE="$SAFE_VAR"; fi
          case "$NETWORK" in
            robinhood-testnet)
              RPC="https://rpc.testnet.chain.robinhood.com/rpc"
              export FACTORY="0xda5a4EA92862e1b254E42E55Da8C10E4e0501746" ;;
            base-sepolia)
              RPC="https://sepolia.base.org"
              export FACTORY="0x0bE77729d6682ee64Ca6327AcA34e5FC555C6AC4" ;;
            *) echo "unknown network $NETWORK"; exit 1 ;;
          esac
          if [ "$BROADCAST" = "true" ]; then
            forge script script/DeployRewards.s.sol --rpc-url "$RPC" --broadcast --slow -vvv
          else
            forge script script/DeployRewards.s.sol --rpc-url "$RPC" -vvv
          fi
