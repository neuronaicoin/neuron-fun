name: contracts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Unit tests (par core + Neuron.fun)
        run: forge test --no-match-path "test/fork/*" --fuzz-runs 5000 -vv

  fork:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Neuron.fun on a fork of Robinhood Chain
        run: forge test --match-path "test/fork/Neuron*" --fork-url robinhood -vvv

      - name: v6 on a fork of Base (real USDC, Base's Uniswap v4)
        shell: bash
        run: |
          # The public Base RPC drops requests when several fork tests hit it at once:
          # run them one at a time, and retry the ones that failed once.
          forge test --match-path "test/fork/NeuronOmniV6*" --fork-url base --threads 1 -vv && exit 0
          echo "---- retrying the failed tests once ----"
          sleep 10
          forge test --match-path "test/fork/NeuronOmniV6*" --fork-url base --threads 1 --rerun -vv

      - name: Real dollars' storage slots (Base USDC, Robinhood USDG)
        run: forge test --match-path "test/fork/DollarSlots*" -vv

      - name: Across bridge on forks of Base and Robinhood (real SpokePools, USDC and USDG)
        run: forge test --match-path "test/fork/AcrossBridge*" -vvv
