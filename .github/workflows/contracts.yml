name: contracts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Unit tests (par core + Neuron.fun)
        run: forge test --no-match-path "test/fork/*" --fuzz-runs 5000 -vv

  fork:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Neuron.fun on a fork of Robinhood Chain
        run: forge test --match-path "test/fork/Neuron*" --fork-url robinhood -vvv

      - name: v6 on a fork of Base (real USDC, Base's Uniswap v4)
        shell: bash
        run: |
          # Short log: the summary plus the trace of the first failing test (the full trace is too long for GitHub).
          forge test --match-path "test/fork/NeuronOmniV6*" --fork-url base -vv && exit 0
          echo "---------------- trace of test_fork_flow_usdcHigh (last 120 lines) ----------------"
          forge test --match-path "test/fork/NeuronOmniV6*" --match-test test_fork_flow_usdcHigh --fork-url base -vvvv 2>&1 | tail -n 120
          exit 1

      - name: Real dollars' storage slots (Base USDC, Robinhood USDG)
        run: forge test --match-path "test/fork/DollarSlots*" -vv

      - name: Across bridge on forks of Base and Robinhood (real SpokePools, USDC and USDG)
        run: forge test --match-path "test/fork/AcrossBridge*" -vvv
