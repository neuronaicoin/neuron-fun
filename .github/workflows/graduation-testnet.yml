name: graduation-testnet

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only decide and report (send nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: graduation-testnet
  cancel-in-progress: false

jobs:
  graduate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: keeper
        run: npm install --no-audit --no-fund

      - name: One graduation pass
        working-directory: keeper
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          # Dollar edition (v5): coins trade against USDC ("native": "USD", 6 decimals).
          # $20 across chains; the winning chain needs at least $10 (the curves' minimum).
          TARGET_USD: "20"
          REPORT_DIR: reports
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          CHAINS: >-
            [{"name":"robinhood-testnet","chainId":46630,
              "rpc":"https://rpc.testnet.chain.robinhood.com/rpc",
              "factory":["0x443696e65CAfD60a56F86E71ffb01377e06B0B9e"],
              "startBlock":123588465,"native":"USD","decimals":6},
             {"name":"base-sepolia","chainId":84532,
              "rpc":"https://sepolia.base.org",
              "factory":["0x0e78b5a53ed3463256F7bc975d25d4aA71F91E47"],
              "startBlock":47491287,"native":"USD","decimals":6}]
        run: node graduation.mjs

      - name: Publish tallies
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if [ -d keeper/reports ] && [ -n "$(git status --porcelain keeper/reports)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keeper/reports
            git commit -m "Graduation tally"
            git pull --rebase --quiet
            git push
          else
            echo "No new tallies."
          fi
