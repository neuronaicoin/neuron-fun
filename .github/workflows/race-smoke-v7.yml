name: deploy-race-testnet

# sasa v7 (five-minute race, native pairs) on testnets. Two steps, each run once per chain:
#   1. step = deploy  on base-sepolia, robinhood-testnet, bsc-testnet, arc-testnet
#   2. step = wire    on each of them (connects the chains)
# Each chain gets its own pair: coin/ETH (Base Sepolia, Robinhood testnet, Uniswap v4),
# coin/BNB (BNB testnet, PancakeSwap Infinity), coin/USDC (Arc testnet, Uniswap v4).
# A fresh v7 test dollar (faucet: $100 a day) and, where there is no Chainlink, a test
# price feed are deployed too; the test dollar pools are created and seeded by the deployer.
# Each deploy saves contracts-v7/deployments/race/<chainid>.json and commits it.
#
# Needs: secret DEPLOYER_PRIVATE_KEY (with test ETH/BNB on every chain: ~0.02 for the
# contracts + 0.02 to seed the dollar pool) and secret RACE_FACTORY_KEY (a NEW wallet, never
# used on any chain, with a little test ETH/BNB on every chain). v6 is not touched.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Chain"
        type: choice
        options:
          - base-sepolia
          - robinhood-testnet
          - bsc-testnet
          - arc-testnet
      step:
        description: "deploy (first, on every chain) or wire (after all chains are deployed)"
        type: choice
        options:
          - deploy
          - wire
      broadcast:
        description: "Actually send transactions (leave unticked for a free dry run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy-race-testnet
  cancel-in-progress: false

jobs:
  race:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts-v7
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # pinned: the exact compiler build is needed to verify the contracts later
          version: v1.3.5

      - name: Get libraries
        run: |
          mkdir -p lib
          git clone -q --depth 1 --branch v1.9.6 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone -q --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          git clone -q https://github.com/Uniswap/v4-periphery lib/v4-periphery
          cd lib/v4-periphery
          git -c advice.detachedHead=false checkout -q 9969eec44cfdf07e24b41de47f40276a58401976
          git submodule update -q --init --depth 1 lib/v4-core lib/permit2
          cd lib/v4-core && git submodule update -q --init --depth 1 lib/solmate
          cd ../../../..
          cp -r ../contracts/lib/layerzero lib/layerzero
          git clone -q https://github.com/pancakeswap/infinity-core lib/infinity-core
          git -C lib/infinity-core -c advice.detachedHead=false checkout -q 3c5ef1be1f71442d8bc60cc6fd11f9c677b714df

      - name: Chain settings and LayerZero addresses
        env:
          NETWORK: ${{ inputs.network }}
        run: |
          case "$NETWORK" in
            base-sepolia) CHAIN_ID=84532; RPC="https://sepolia.base.org"; KIND=eth
              PM=0x05E73354cFDd6745C338b50BcFDfA3Aa6fA03408; POSM=0x4B2C77d209D3405F41a037Ec6c77F7F5b8e2ca80
              FEED=0x4aDC67696bA383F43DD60A9e78F2C97Fbbfc7cb1 ;;   # Chainlink ETH / USD (checked by the script)
            robinhood-testnet) CHAIN_ID=46630; RPC="https://rpc.testnet.chain.robinhood.com/rpc"; KIND=eth
              PM=0x8366a39CC670B4001A1121B8F6A443A643e40951; POSM=0x58daec3116aae6D93017bAAea7749052E8a04fA7
              FEED= ;;                                               # no Chainlink here: a test feed
            bsc-testnet) CHAIN_ID=97; RPC="https://bsc-testnet-rpc.publicnode.com"; KIND=pcs
              VAULT=0x2CdB3EC82EE13d341Dc6E73637BE0Eab79cb79dD; CLPM=0x36A12c70c9Cf64f24E89ee132BF93Df2DCD199d4
              WNATIVE=0xae13d989daC2f0dEbFf460aC112a837C89BAa7cd
              FEED=0x2514895c72f50D8bd4B4F9b1110F0D6bD2c97526 ;;   # Chainlink BNB / USD (checked by the script)
            arc-testnet) CHAIN_ID=5042002; RPC="https://rpc.testnet.arc.network"; KIND=usdc
              PM=0x8366a39CC670B4001A1121B8F6A443A643e40951; POSM=0x6049c9a0e26405C0985f9E3685C87d0aE917f82B
              FEED= ;;
            *) echo "unknown network $NETWORK"; exit 1 ;;
          esac
          GOT_ID=$(cast chain-id --rpc-url "$RPC")
          if [ "$GOT_ID" != "$CHAIN_ID" ]; then echo "RPC is chain $GOT_ID, expected $CHAIN_ID"; exit 1; fi
          # The coordinator (where races are decided) lives on Base Sepolia, as in v6.
          COORD_EID=40245
          curl -fsSL https://metadata.layerzero-api.com/v1/metadata/deployments -o /tmp/lz.json
          CHAIN=$(jq -c --argjson id "$CHAIN_ID" '[to_entries[] | select(.value.chainDetails.nativeChainId == $id and (.key|endswith("-testnet")))][0].value' /tmp/lz.json)
          if [ "$CHAIN" = "null" ] || [ -z "$CHAIN" ]; then echo "LayerZero has no testnet entry for chain $CHAIN_ID"; exit 1; fi
          V2=$(echo "$CHAIN" | jq -c '[.deployments[] | select(.version == 2)][0]')
          EID=$(echo "$V2" | jq -r '.eid')
          ENDPOINT=$(echo "$V2" | jq -r '.endpointV2.address')
          SEND_LIB=$(echo "$V2" | jq -r '.sendUln302.address')
          RECEIVE_LIB=$(echo "$V2" | jq -r '.receiveUln302.address')
          EXECUTOR=$(echo "$V2" | jq -r '.executor.address')
          DVNS=$(echo "$CHAIN" | jq -r '[.dvns | to_entries[] | select(.value.id == "layerzero-labs" and (.value.deprecated|not) and (.value.lzReadCompatible|not)) | .key] | sort | join(",")')
          for v in EID ENDPOINT SEND_LIB RECEIVE_LIB EXECUTOR DVNS; do
            eval "val=\$$v"; if [ -z "$val" ] || [ "$val" = "null" ]; then echo "missing $v"; exit 1; fi; echo "$v=$val"
          done
          GOT=$(cast call "$ENDPOINT" "eid()(uint32)" --rpc-url "$RPC" | awk '{print $1}')
          if [ "$GOT" != "$EID" ]; then echo "endpoint says eid $GOT, expected $EID"; exit 1; fi
          {
            echo "CHAIN_ID=$CHAIN_ID"; echo "RPC=$RPC"; echo "BUILDER_KIND=$KIND"; echo "TESTNET=true"
            echo "POOL_MANAGER=${PM:-}"; echo "POSITION_MANAGER=${POSM:-}"; echo "DOLLAR_FEE=500"; echo "DOLLAR_SPACING=10"
            echo "VAULT=${VAULT:-}"; echo "CL_POOL_MANAGER=${CLPM:-}"; echo "WNATIVE=${WNATIVE:-}"; echo "PRICE_FEED=${FEED:-}"
            echo "COORD_EID=$COORD_EID"; echo "LOCAL_EID=$EID"; echo "LZ_ENDPOINT=$ENDPOINT"
            echo "SEND_LIB=$SEND_LIB"; echo "RECEIVE_LIB=$RECEIVE_LIB"; echo "EXECUTOR=$EXECUTOR"; echo "DVNS=$DVNS"
          } >> "$GITHUB_ENV"

      - name: Drop deployment files of the earlier v7 layout (USDC pools only)
        run: |
          for f in deployments/race/*.json; do
            [ -f "$f" ] || continue
            if ! jq -e '.builderKind' "$f" >/dev/null 2>&1; then echo "removing old $f"; rm -f "$f"; fi
          done

      - name: Build
        run: forge build

      - name: Run
        env:
          RAW_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          RAW_FKEY: ${{ secrets.RACE_FACTORY_KEY }}
          STEP: ${{ inputs.step }}
          BROADCAST: ${{ inputs.broadcast }}
        run: |
          norm() { k="$(printf '%s' "$1" | tr -d '[:space:]')"; case "$k" in 0x*) ;; *) k="0x$k" ;; esac; echo "$k"; }
          KEY=$(norm "$RAW_KEY"); echo "::add-mask::$KEY"; export PRIVATE_KEY="$KEY"
          if [ "$KEY" = "0x" ]; then echo "DEPLOYER_PRIVATE_KEY secret is missing"; exit 1; fi
          export MIN_DVNS=1 CONFIRMATIONS=2 START_MC=3000000000 MIN_FIRST_BUY=5000000
          # test ETH/BNB put into the test dollar pool (testnet faucets are stingy: 0.02 is enough for $5 races)
          export SEED_WEI=20000000000000000
          # Robinhood testnet's faucet gives 0.01 a day: a smaller seed there (deepen later)
          if [ "$CHAIN_ID" = "46630" ]; then export SEED_WEI=5000000000000000; fi
          FLAGS="--rpc-url $RPC -vv"
          if [ "$BROADCAST" = "true" ]; then FLAGS="$FLAGS --broadcast --slow"; fi
          if [ "$STEP" = "deploy" ]; then
            FKEY=$(norm "$RAW_FKEY"); echo "::add-mask::$FKEY"
            if [ "$FKEY" = "0x" ]; then echo "RACE_FACTORY_KEY secret is missing (a new, never-used wallet)"; exit 1; fi
            export RACE_FACTORY_KEY="$FKEY"
            forge script script/race/DeployRace.s.sol $FLAGS
          else
            OTHERS=""
            for f in deployments/race/*.json; do
              id=$(basename "$f" .json); [ "$id" = "$CHAIN_ID" ] && continue
              OTHERS="${OTHERS:+$OTHERS,}$id"
            done
            if [ ! -f "deployments/race/$CHAIN_ID.json" ] || [ -z "$OTHERS" ]; then
              echo "Deploy on every chain first (missing deployments/race files)"; exit 1
            fi
            # testnets: LayerZero lacks some pairs (e.g. Robinhood testnet <-> Arc testnet); skip them with a warning
            export REMOTE_CHAIN_IDS="$OTHERS" LOCK_BRIDGE=true OPEN_LAUNCHES=true ALLOW_MISSING_ROUTES=true
            forge script script/race/WireRace.s.sol $FLAGS
          fi

      - name: Save addresses to the repo
        if: inputs.step == 'deploy' && inputs.broadcast
        run: |
          git config user.name "sasa-deploy"
          git config user.email "deploy@sasapad.fun"
          git add -A deployments/race
          git commit -m "v7 race deployed on ${{ inputs.network }}" || echo "nothing to commit"
          git pull --rebase
          git push
