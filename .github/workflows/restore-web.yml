name: restore-web

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop ignoring web/ and keeper/
        run: |
          set -euo pipefail
          sed -i '/^# the interface, indexer and keeper/d; /^web\/$/d; /^indexer\/$/d; /^keeper\/$/d' .gitignore
          ! grep -qx 'web/' .gitignore

      - name: Bring the website files back from history and put them in web/
        run: |
          set -euo pipefail
          SRC=b4944a1
          git checkout "$SRC" -- abis.ts config.ts data.ts format.ts chrome.tsx coins.tsx wallet.tsx \
            favicon.svg globals.css layout.tsx next.config.mjs package.json package-lock.json \
            postcss.config.mjs tsconfig.json "page.tsx" "page (1).tsx" "page (2).tsx" "page (3).tsx"
          git show "$SRC:README.md" > web-readme.tmp
          mkdir -p web/app/create web/app/coin web/app/how-it-works web/components web/lib web/public
          mv abis.ts config.ts data.ts format.ts web/lib/
          mv chrome.tsx coins.tsx wallet.tsx web/components/
          mv favicon.svg web/public/
          mv globals.css layout.tsx web/app/
          mv next.config.mjs package.json package-lock.json postcss.config.mjs tsconfig.json web/
          mv web-readme.tmp web/README.md
          for f in "page.tsx" "page (1).tsx" "page (2).tsx" "page (3).tsx"; do
            if grep -q "export default function Home" "$f"; then mv "$f" web/app/page.tsx
            elif grep -q "export default function CreatePage" "$f"; then mv "$f" web/app/create/page.tsx
            elif grep -q "export default function CoinPageWrapper" "$f"; then mv "$f" web/app/coin/page.tsx
            elif grep -q "export default function HowItWorks" "$f"; then mv "$f" web/app/how-it-works/page.tsx
            else echo "Unrecognised page file: $f"; exit 1; fi
          done
          printf 'node_modules/\n.next/\nout/\nnext-env.d.ts\n*.tsbuildinfo\n' > web/.gitignore

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the website builds
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          NEXT_TELEMETRY_DISABLED=1 npm run build
          rm -rf node_modules .next out next-env.d.ts

      - name: Save, and check every file really went in
        run: |
          set -euo pipefail
          git rm -q .github/workflows/restore-web.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          for f in web/package.json web/app/page.tsx web/app/create/page.tsx web/app/coin/page.tsx \
                   web/app/how-it-works/page.tsx web/lib/config.ts web/components/wallet.tsx; do
            git ls-files --error-unmatch "$f" > /dev/null || { echo "NOT STAGED: $f"; exit 1; }
          done
          git commit -m "Restore website into web/ and stop ignoring it"
          git push
