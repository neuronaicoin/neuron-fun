name: deploy-testnet

on:
  workflow_dispatch:
    inputs:
      broadcast:
        description: "Actually send transactions (leave unticked for a free dry run)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Deploy Neuron.fun to Robinhood Chain testnet
        env:
          RAW_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          RPC: https://rpc.testnet.chain.robinhood.com/rpc
          BROADCAST: ${{ inputs.broadcast }}
        run: |
          KEY="$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')"
          if [ -z "$KEY" ]; then echo "DEPLOYER_PRIVATE_KEY secret is missing"; exit 1; fi
          case "$KEY" in 0x*) ;; *) KEY="0x$KEY" ;; esac
          echo "::add-mask::$KEY"
          export PRIVATE_KEY="$KEY"
          if [ "$BROADCAST" = "true" ]; then
            forge script script/DeployNeuron.s.sol --rpc-url "$RPC" --broadcast --slow -vvv
          else
            forge script script/DeployNeuron.s.sol --rpc-url "$RPC" -vvv
          fi

      - name: Keep the deployment record
        if: ${{ inputs.broadcast }}
        uses: actions/upload-artifact@v4
        with:
          name: testnet-deployment
          path: contracts/broadcast/DeployNeuron.s.sol/
          if-no-files-found: warn
