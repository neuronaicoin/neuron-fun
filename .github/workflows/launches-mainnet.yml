name: launches-mainnet

# Opens or closes new coin launches on all four chains (contracts-v7/script/race/launches.sh).
# Trading and coins already launched are never affected.

on:
  workflow_dispatch:
    inputs:
      open:
        description: "Launches open?"
        type: choice
        options: ["false", "true"]
        default: "false"

jobs:
  launches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run
        env:
          OPEN: ${{ inputs.open }}
          RAW_KEY: ${{ secrets.MAINNET_DEPLOYER_KEY }}
        run: |
          set -uo pipefail
          k="$(printf '%s' "${RAW_KEY:-}" | tr -d '[:space:]')"; case "$k" in 0x*) ;; *) k="0x$k" ;; esac
          echo "::add-mask::$k"
          [ "$k" = "0x" ] && { echo "Secret MAINNET_DEPLOYER_KEY is missing"; exit 1; }
          export PRIVATE_KEY="$k"
          REPORT="$GITHUB_STEP_SUMMARY" bash contracts-v7/script/race/launches.sh
