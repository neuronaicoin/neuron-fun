name: Ascend testnet scan

# Started by hand. Reads public Elysium testnet data (who launched and bought on Ascend), saves the
# watch list to indexer/ascend-watch.json and shows the top wallets on the run's summary page.
on:
  workflow_dispatch:
    inputs:
      launchpad:
        description: "Ascend launchpad address (empty = the known testnet one)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan
        run: node ascendscan.mjs ${{ inputs.launchpad }}
      - name: Save the watch list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascend-watch.json
          git diff --cached --quiet && exit 0
          git commit -m "Ascend testnet scan"
          # the repo may have moved on during the scan: catch up, then push (a few tries)
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
      - name: Keep a copy on the run page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascend-watch
          path: indexer/ascend-watch.json
          if-no-files-found: ignore
