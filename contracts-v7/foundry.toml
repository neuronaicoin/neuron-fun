[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
gas_limit = "3000000000"
fs_permissions = [{ access = "read", path = "./out" }, { access = "read-write", path = "./deployments" }]
# Uniswap's own contracts (compiled only for the local tests) need their own optimizer settings.
additional_compiler_profiles = [
  { name = "v4core", via_ir = true, optimizer_runs = 44444444 },
  { name = "posm", via_ir = true, optimizer_runs = 500 },
]
compilation_restrictions = [
  { paths = "test/v4/ImportPoolManager.sol", optimizer_runs = 44444444 },
  { paths = "lib/v4-periphery/lib/v4-core/src/PoolManager.sol", optimizer_runs = 44444444 },
  { paths = "test/v4/ImportPositionManager.sol", optimizer_runs = 500 },
  { paths = "lib/v4-periphery/src/PositionManager.sol", optimizer_runs = 500 },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "permit2/=lib/v4-periphery/lib/permit2/",
  "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
  "@layerzerolabs/=lib/layerzero/@layerzerolabs/",
  "solidity-bytes-utils/=lib/layerzero/solidity-bytes-utils/",
]

[fuzz]
runs = 500

[rpc_endpoints]
base = "https://mainnet.base.org"
robinhood = "https://rpc.mainnet.chain.robinhood.com"
